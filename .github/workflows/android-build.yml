name: Android Build & Quality Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Validate Ultron APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log || {
            echo "=================== BUILD FAILURE LOG ==================="
            grep -E "e: |error:|FAILURE|Exception" gradle_build.log -B 2 -A 8 | head -n 100 || tail -n 100 gradle_build.log
            exit 1
          }
          # Ensure target file name is Ultron-v0.19.0-debug.apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} app/build/outputs/apk/debug/Ultron-v0.19.0-debug.apk \;
          ls -la app/build/outputs/apk/debug/

      - name: Upload Ultron Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Debug-APK
          path: app/build/outputs/apk/debug/Ultron-v0.19.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish English GitHub Release (v0.19.0)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.19.0
          name: "ULTRON v0.19.0 — Complete ULTRON Migration, Public APIs & APK CI Build"
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/Ultron-v0.19.0-debug.apk
          body: |
            # ⚡ ULTRON 0.19.0 — Complete ULTRON Migration & CI/CD Pipeline

            ### 🚀 What's New
            - **Full ULTRON Branding**: All references migrated from the legacy "Friday" codebase to **ULTRON** (`com.ultron.ai`).
            - **APK Renamed**: Download file is now `Ultron-v0.19.0-debug.apk` — no more `Friday-*.apk`.
            - **Automated CI/CD**: GitHub Actions build, test, lint, security scan, and APK artifact generation — fully green.
            - **English Release Notes**: All release content is now in English and Tanglish.

            ### 🎙️ Voice HUD Panel
            - **Compact Bottom Panel**: Arc reactor HUD, real-time status (*"Listening"*, *"Thinking"*, *"ULTRON · ..."*), 2-line response preview, and dismiss button.
            - **Tap to Expand**: Tapping response text expands the full transcript without closing the panel.
            - **Native In-App HUD**: When ULTRON is open, the HUD renders inside the app — no overlay window.

            ### 🔒 Lock Screen Integration & Security
            - **Configurable Security Levels**: *"Safe Only"*, *"Voice Authenticated"*, or *"Unlock Required"*.
            - **Sensitive Actions Protection**: SMS and call commands prompt Android system unlock first. ULTRON never sees your PIN.
            - **Privacy Shield**: Lock screen overlay shows only conversation status. Tap *"Unlock for details"* for full answers.
            - **Smart Screen Wake**: Display stays active during conversations + 10s post-response (max 2 min idle).

            ### 🇮🇳 Tanglish Summary
            - **Full ULTRON Branding**: Ella "Friday" references-um "ULTRON"-ku maathirukkum.
            - **APK File**: `Ultron-v0.19.0-debug.apk` nu download aagum — old Friday name illai.
            - **Voice HUD**: Arc reactor indicator, status text, 2-line preview panel. Text tap panna full answer expand aagum.
            - **Lock Screen**: 3 security levels. SMS madhiri sensitive actions-ku Android unlock kekkum.

            ---
            > **Download**: Grab `Ultron-v0.19.0-debug.apk` from the Assets below and install directly!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 14

