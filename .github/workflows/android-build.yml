name: Android Build & Quality Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Validate Ultron APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log || {
            echo "=================== BUILD FAILURE LOG ==================="
            grep -E "e: |error:|FAILURE|Exception" gradle_build.log -B 2 -A 8 | head -n 100 || tail -n 100 gradle_build.log
            exit 1
          }
          # Ensure target file name is Ultron-v0.20.0-debug.apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp -f {} app/build/outputs/apk/debug/Ultron-v0.20.0-debug.apk \;
          ls -la app/build/outputs/apk/debug/

      - name: Upload Ultron Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Debug-APK
          path: app/build/outputs/apk/debug/Ultron-v0.20.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish English GitHub Release (v0.20.0)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.20.0
          name: "ULTRON v0.20.0 — Pure English HUD & Official Mask Logo"
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/Ultron-v0.20.0-debug.apk
          body: |
            # ⚡ ULTRON 0.20.0 — 100% English & Official Ultron Mask Logo

            ### 🚀 What's New in v0.20.0
            - **Official Ultron Mask Logo**: Launcher icon updated with the vector SVG Ultron mask (`ic_launcher.xml` and `ic_launcher_round.xml`) featuring glowing crimson eyes and dark chassis contours.
            - **100% Pure English UI**: Completely eliminated all legacy Russian strings across Chat, Diagnostics, History Drawer, Notebook, Settings, Mode Selectors, and Voice Panels.
            - **Tanglish & English Ready**: Complete support for English and Tanglish commands and responses.
            - **New Build Artifact**: Direct download of `Ultron-v0.20.0-debug.apk`.

            ---
            > **Download**: Grab `Ultron-v0.20.0-debug.apk` directly from the Assets below!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 14

