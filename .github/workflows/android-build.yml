name: Android Build & Quality Validation

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Validate Ultron APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log || {
            echo "=================== BUILD FAILURE LOG ==================="
            grep -E "e: |error:|FAILURE|Exception" gradle_build.log -B 2 -A 8 | head -n 100 || tail -n 100 gradle_build.log
            exit 1
          }
          # Ensure target file name is Ultron-v0.18.0-debug.apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} app/build/outputs/apk/debug/Ultron-v0.18.0-debug.apk \;
          ls -la app/build/outputs/apk/debug/

      - name: Upload Ultron Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-Debug-APK
          path: app/build/outputs/apk/debug/Ultron-v0.18.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish English GitHub Release (v0.18.0)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.18.0
          name: "ULTRON v0.18.0 — Arc Voice Assistant & Lock Screen HUD"
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/Ultron-v0.18.0-debug.apk
          body: |
            # ⚡ ULTRON 0.18.0 — New Voice HUD Panel & Lock Screen Security

            ### 🎙️ Voice HUD Panel
            - **Compact Bottom Panel**: Arc reactor HUD, real-time status indicator (*"Listening"*, *"Thinking"*, *"ULTRON · ..."*), dynamic 2-line response preview, and dismiss button.
            - **Tap to Expand**: Tapping response text expands the entire response transcript cleanly without closing the panel.
            - **Native In-App HUD**: When ULTRON is open, the HUD renders natively inside the app rather than as a secondary window.

            ### 🔒 Lock Screen Integration & Security
            - **Configurable Security Levels**: *"Safe Only"*, *"Voice Authenticated"*, or *"Unlock Required"*.
            - **Sensitive Actions Protection**: Actions involving other people (SMS, calls) prompt system Android unlock and execute immediately after. ULTRON never sees or accesses your PIN/pattern.
            - **Privacy HUD Overlay**: Only conversation phase is shown over the lock screen—spoken words, personal names, and answers remain private until tapping *"Unlock for details"*.
            - **Intelligent Screen Keep-Alive**: Screen stays awake during conversations and for 10 seconds following a response (max 2 minutes idle timeout).
            - **Graceful Notification Fallback**: Without full-screen notification permissions, ULTRON sends a private notification; without notifications, ULTRON replies purely via voice.

            > **Setup Tip**: To enable the lock screen overlay, grant ULTRON *Full-Screen Notifications* under **Settings → Lock Screen**.

            ---

            ### 🇮🇳 Tanglish Overview
            - **Compact HUD Panel**: Arc reactor indicator, *"Listening"*, *"Thinking"* status, 2-line preview oda clean panel. Text mela tap panna full answer expand aagum.
            - **Lock Screen Security**: 3 levels (*Safe only*, *Voice-ku aprom*, *Unlock pannadhukku aprom*). SMS madhiri actions-ku Android system unlock kekkum. Personal details lock screen mela hide aagirukkum.
            - **Direct APK**: Download `Ultron-v0.18.0-debug.apk` below and install directly!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 14

