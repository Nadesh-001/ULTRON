<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ULTRON — an advanced AI assistant for Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090203"/>
      <stop offset="1" stop-color="#140507"/>
    </linearGradient>
    <radialGradient id="halo" cx="300" cy="210" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2233" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#7A101A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#090203" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#FF858F"/>
      <stop offset="1" stop-color="#FF2233"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF858F"/>
      <stop offset="1" stop-color="#FF2233"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- Technical Red Grid -->
  <g stroke="#FF2233" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="420"/><line x1="40" y1="0" x2="40" y2="420"/><line x1="80" y1="0" x2="80" y2="420"/><line x1="120" y1="0" x2="120" y2="420"/><line x1="160" y1="0" x2="160" y2="420"/><line x1="200" y1="0" x2="200" y2="420"/><line x1="240" y1="0" x2="240" y2="420"/><line x1="280" y1="0" x2="280" y2="420"/><line x1="320" y1="0" x2="320" y2="420"/><line x1="360" y1="0" x2="360" y2="420"/><line x1="400" y1="0" x2="400" y2="420"/><line x1="440" y1="0" x2="440" y2="420"/><line x1="480" y1="0" x2="480" y2="420"/><line x1="520" y1="0" x2="520" y2="420"/><line x1="560" y1="0" x2="560" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/><line x1="640" y1="0" x2="640" y2="420"/><line x1="680" y1="0" x2="680" y2="420"/><line x1="720" y1="0" x2="720" y2="420"/><line x1="760" y1="0" x2="760" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="840" y1="0" x2="840" y2="420"/><line x1="880" y1="0" x2="880" y2="420"/><line x1="920" y1="0" x2="920" y2="420"/><line x1="960" y1="0" x2="960" y2="420"/><line x1="1000" y1="0" x2="1000" y2="420"/><line x1="1040" y1="0" x2="1040" y2="420"/><line x1="1080" y1="0" x2="1080" y2="420"/><line x1="1120" y1="0" x2="1120" y2="420"/><line x1="1160" y1="0" x2="1160" y2="420"/><line x1="1200" y1="0" x2="1200" y2="420"/><line x1="1240" y1="0" x2="1240" y2="420"/><line x1="1280" y1="0" x2="1280" y2="420"/>
    <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="280" x2="1280" y2="280"/><line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="400" x2="1280" y2="400"/>
  </g>

  <!-- Glowing Red Radial Halo -->
  <rect width="1280" height="420" rx="24" fill="url(#halo)"/>

  <!-- Left Side: Circular Tactical HUD Rings -->
  <g transform="translate(300 210)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="#FF2233" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="2 10"/>
    <circle cx="0" cy="0" r="196" fill="none" stroke="#FF2233" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="60 18"/>
    <circle cx="0" cy="0" r="224" fill="none" stroke="#FF2233" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- Left Side: Ultron Visage / Emblem Silhouette -->
  <g transform="translate(300 210) scale(2.8) translate(-54 -54)" filter="url(#soft)">
    <!-- Helmet contour -->
    <path d="M34,26 L54,20 L74,26 L82,40 L78,54 L72,66 L54,88 L36,66 L30,54 L26,40 Z" 
          fill="#1C060A" stroke="#FF2233" stroke-opacity="0.75" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Forehead / Brow crest -->
    <path d="M34,34 L54,28 L74,34 L70,44 L54,40 L38,44 Z" 
          fill="#2B070E" stroke="#FF2233" stroke-opacity="0.5" stroke-width="1.2"/>

    <!-- Left Eye -->
    <polygon points="37,47 49,45 47,51 38,51" fill="url(#redGlow)"/>
    <line x1="36" y1="46" x2="50" y2="44" stroke="#FFFF858F" stroke-width="1"/>
    
    <!-- Right Eye -->
    <polygon points="71,47 59,45 61,51 70,51" fill="url(#redGlow)"/>
    <line x1="72" y1="46" x2="58" y2="44" stroke="#FFFF858F" stroke-width="1"/>
    
    <!-- Center Node -->
    <circle cx="54" cy="33" r="2.2" fill="#FF858F"/>

    <!-- Mouth / Jaw Grille -->
    <path d="M42,65 L54,61 L66,65 L60,77 L54,79 L48,77 Z" fill="#2B0509" stroke="#FF2233" stroke-width="1.5"/>
    <path d="M44,67 L54,64 L64,67 L59,74 L54,76 L49,74 Z" fill="url(#redGlow)"/>
    <line x1="50" y1="65" x2="50" y2="74" stroke="#1A0003" stroke-width="1.2"/>
    <line x1="54" y1="64" x2="54" y2="76" stroke="#1A0003" stroke-width="1.2"/>
    <line x1="58" y1="65" x2="58" y2="74" stroke="#1A0003" stroke-width="1.2"/>

    <!-- Jaw lines -->
    <line x1="33" y1="52" x2="42" y2="65" stroke="#FF2233" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="75" y1="52" x2="66" y2="65" stroke="#FF2233" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="54" y1="79" x2="54" y2="88" stroke="#FF2233" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>

  <!-- Typography Right Side -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
    <text x="560" y="190" font-size="106" font-weight="800" letter-spacing="12" fill="url(#title)">ULTRON</text>
    <text x="566" y="246" font-size="28" font-weight="500" fill="#FBE4E6" fill-opacity="0.95">An advanced autonomous AI assistant for Android</text>
    <text x="566" y="296" font-size="17" font-weight="600" letter-spacing="3.5" fill="#FF2233" fill-opacity="0.85">ENGLISH &amp; TANGLISH · WAKE WORD · SPEAKER VERIFICATION · PHONE CONTROL</text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="#FF2233" stroke-opacity="0.3"/>
</svg>
