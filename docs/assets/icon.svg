<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="160" height="160" role="img" aria-label="Ultron AI">
  <defs>
    <radialGradient id="bloom" cx="54" cy="54" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2233" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#7A101A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#090203" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D131A"/>
      <stop offset="0.5" stop-color="#220A0E"/>
      <stop offset="1" stop-color="#140507"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF858F"/>
      <stop offset="1" stop-color="#FF2233"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="r"><rect width="108" height="108" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <!-- Base Background -->
    <rect width="108" height="108" fill="#090203"/>
    <rect width="108" height="108" fill="url(#bloom)"/>

    <!-- Outer Circular Technical Ring -->
    <circle cx="54" cy="54" r="44" fill="none" stroke="#FF2233" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="6 3"/>
    <circle cx="54" cy="54" r="40" fill="none" stroke="#FF2233" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Subtle HUD ticks -->
    <line x1="54" y1="6" x2="54" y2="12" stroke="#FF2233" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="96" x2="54" y2="102" stroke="#FF2233" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="54" x2="12" y2="54" stroke="#FF2233" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    <line x1="96" y1="54" x2="102" y2="54" stroke="#FF2233" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

    <!-- Ultron Stylized Helmet / Mask Silhouette -->
    <!-- Cranium & Temples -->
    <path d="M34,26 L54,20 L74,26 L82,40 L78,54 L72,66 L54,88 L36,66 L30,54 L26,40 Z" 
          fill="url(#metal)" stroke="#FF2233" stroke-opacity="0.65" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Brow & Forehead Crest Plates -->
    <path d="M34,34 L54,28 L74,34 L70,44 L54,40 L38,44 Z" 
          fill="#1C060A" stroke="#FF2233" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Glowing Red Optics / Eyes -->
    <g filter="url(#glow)">
      <!-- Left Eye -->
      <polygon points="37,47 49,45 47,51 38,51" fill="url(#redGlow)"/>
      <line x1="36" y1="46" x2="50" y2="44" stroke="#FFFF858F" stroke-width="1"/>
      
      <!-- Right Eye -->
      <polygon points="71,47 59,45 61,51 70,51" fill="url(#redGlow)"/>
      <line x1="72" y1="46" x2="58" y2="44" stroke="#FFFF858F" stroke-width="1"/>
      
      <!-- Center Forehead Core Node -->
      <circle cx="54" cy="33" r="2.2" fill="#FF858F"/>

      <!-- Iconic Ultron Menacing Mouth / Energy Grille -->
      <path d="M42,65 L54,61 L66,65 L60,77 L54,79 L48,77 Z" fill="#2B0509" stroke="#FF2233" stroke-width="1.5"/>
      <path d="M44,67 L54,64 L64,67 L59,74 L54,76 L49,74 Z" fill="url(#redGlow)"/>
      
      <!-- Grille teeth lines -->
      <line x1="50" y1="65" x2="50" y2="74" stroke="#1A0003" stroke-width="1.2"/>
      <line x1="54" y1="64" x2="54" y2="76" stroke="#1A0003" stroke-width="1.2"/>
      <line x1="58" y1="65" x2="58" y2="74" stroke="#1A0003" stroke-width="1.2"/>
    </g>

    <!-- Jaw & Cheek Contours -->
    <line x1="33" y1="52" x2="42" y2="65" stroke="#FF2233" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="75" y1="52" x2="66" y2="65" stroke="#FF2233" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="54" y1="79" x2="54" y2="88" stroke="#FF2233" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
